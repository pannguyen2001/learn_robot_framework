name: Run Robot Framework Tests

on:
  workflow_dispatch:
  schedule:
    - cron: '0 17 * * *'

jobs:
  test:
    runs-on: ubuntu-latest
    environment: BASE_URL

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '>=3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Install additional dependencies if needed
          pip install -r requirements.txt
      
      - name: Initialize Robot Framework Browser
        run: |
          rfbrowser init chromium --with-deps
      
      - name: Check test environment
        env:
          BASE_URL: ${{ secrets.BASE_URL }}
          USERS_JSON: ${{ secrets.USERS_JSON }}
        run: |
          [ -n "$BASE_URL" ] || { echo "BASE_URL missing"; exit 1; }
          [ -n "$USERS_JSON" ] || { echo "USERS_JSON missing"; exit 1; }

      - name: Run Robot Framework tests
        env:
          BASE_URL: ${{ secrets.BASE_URL }}
          USERS_JSON: ${{ secrets.USERS_JSON }}
          WORK_TOKEN: ${{ secrets.GIT_TOKEN }}
          TZ: Asia/Ho_Chi_Minh
        run: |
          run_robot() {
            xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" \
              robot --variable HEADLESS:True "$@"
          }

          rc=0
          run_robot --outputdir results --exclude skip src/tests/ || rc=$?

          if [ $rc -ne 0 ] && [ -f results/output.xml ]; then
            echo "Tests failed. Rerunning failed tests..."
            rc=0
            run_robot --rerunfailed results/output.xml \
              --outputdir results_rerun --exclude skip src/tests/ || true

            if [ -f results_rerun/output.xml ]; then
              # rebot's exit code reflects the merged result (after rerun)
              rebot --output results/output.xml --log results/log.html \
                --report results/report.html \
                --merge results/output.xml results_rerun/output.xml || rc=$?
            else
              echo "No rerun output found; keeping original failure."
              rc=1
            fi
          fi

          exit $rc

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: robot-test-results
          path: ./results
          retention-days: 3
