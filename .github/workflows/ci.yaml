name: Run Robot Framework Tests

on:
  workflow_dispatch:
  schedule:
    - cron: '0 17 * * *'

jobs:
  test:
    runs-on: ubuntu-latest
    environment: BASE_URL

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '>=3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Install additional dependencies if needed
          pip install -r requirements.txt
      
      - name: Initialize Robot Framework Browser
        run: |
          rfbrowser init --with-deps
      
      - name: Check test environment
        env:
          BASE_URL: ${{ secrets.BASE_URL }}
          USERS_JSON: ${{ secrets.USERS_JSON }}
        run: |
          [ -n "$BASE_URL" ] || { echo "BASE_URL missing"; exit 1; }
          [ -n "$USERS_JSON" ] || { echo "USERS_JSON missing"; exit 1; }

      - name: Run Robot Framework tests
        env:
          BASE_URL: ${{ secrets.BASE_URL }}
          USERS_JSON: ${{ secrets.USERS_JSON }}
          WORK_TOKEN: ${{ secrets.GIT_TOKEN }}
          TZ: Asia/Ho_Chi_Minh
        run: |
          if ! robot --outputdir results --exclude skip src/tests/; then
              echo "Robot Framework tests failed. Rerunning failed tests..."
              if [ -f results/output.xml ]; then
                  robot --rerunfailed results/output.xml --outputdir results_rerun src/tests/ || true
                  if [ -f results_rerun/output.xml ]; then
                      rebot --output results/output.xml --log results/log.html --report results/report.html --merge results/output.xml results_rerun/output.xml
                  else
                      echo "No output.xml file found from rerun. Skipping merge."
                  fi
              else
                  echo "No output.xml file found. Cannot rerun failed tests."
              fi
          fi

          echo "Script execution completed"
        continue-on-error: false

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          path: ./results
          name: robot-test-results
          retention-days: 3
